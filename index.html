<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101719"><title>Адреси · Нова пошта / ROZFOOD</title>
<style>
:root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f4f6f5;background:#0d1214}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 90% 0%,#263334,#0d1214 55%);min-height:100dvh}.app-shell{max-width:680px;margin:auto;padding:28px 18px calc(110px + env(safe-area-inset-bottom));min-height:100dvh}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#9caeac;font-weight:800}h1{font-size:31px;letter-spacing:-.055em;margin:5px 0 0}.pill{border:1px solid #354347;border-radius:20px;padding:8px 12px;color:#b6c7c6;font-size:12px}.panel{border:1px solid #344044;border-radius:25px;background:linear-gradient(150deg,#222c2f,#161e21);overflow:hidden;margin-bottom:18px;box-shadow:0 18px 45px #0003}.panel-head{padding:23px 21px 17px;display:flex;align-items:center;gap:13px}.brand-icon{display:grid;place-items:center;width:47px;height:47px;border-radius:15px;background:#e52c35;color:white;font-size:25px;font-weight:900}.brand-icon.green{background:#086b50}.brand-name{font-size:21px;font-weight:850;letter-spacing:-.035em}.subtitle{font-size:12px;color:#a4b4b4;margin-top:4px}.fields{padding:0 14px 16px}.field{border-top:1px solid #ffffff12;padding:12px 6px;display:flex;gap:10px;align-items:center}.field-content{flex:1;min-width:0}label{display:block;font-size:11px;color:#9baead;margin-bottom:5px}input{width:100%;border:0;background:transparent;color:#f8faf9;font:600 15px inherit;font-size:15px;font-weight:650;outline:none;padding:2px 0;text-overflow:ellipsis}input:focus{color:#fff}.copy{border:1px solid #455256;background:#2c383c;color:#e8f3f2;width:39px;height:39px;border-radius:12px;cursor:pointer;font-size:18px;flex:none}.copy:active,.action:active{transform:scale(.96)}.actions{display:flex;gap:10px;padding:0 19px 20px}.action{border:0;background:#e62c36;color:white;border-radius:14px;padding:14px 16px;font-weight:800;flex:1;cursor:pointer}.action.green{background:#087d5b}.action.secondary{background:#2b383c;color:#e4eeee}.hint{color:#819392;font-size:12px;line-height:1.6;margin:8px 5px}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:2px;width:87%;height:68px;border-radius:22px;background:#273337ed;border:1px solid #516063;box-shadow:0 9px 35px #0009;display:flex;align-items:center;justify-content:space-around;z-index:50;backdrop-filter:blur(18px);max-width:590px}.dock button{border:0;background:none;color:#d6e5e2;font-size:12px;font-weight:750;padding:10px;cursor:pointer}.dock button span{display:block;font-size:22px;margin-bottom:3px}#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#d9f8e8;color:#063f2e;border-radius:13px;padding:12px 18px;font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;white-space:nowrap}#toast.show{opacity:1}@media(min-width:650px){.app-shell{padding-top:44px}h1{font-size:38px}}
</style></head><body><div id="toast" role="status" aria-live="polite">Скопійовано ✓</div><main class="app-shell"><header><div><div class="eyebrow">DELIVERY / CONTACT CARD</div><h1>Адреси доставки</h1></div><div class="pill">● READY</div></header><section class="panel" id="nova"><div class="panel-head"><div class="brand-icon">↔</div><div><div class="brand-name">Нова пошта</div><div class="subtitle">Дані для відправлення посилки</div></div></div><div class="fields" id="nova-fields"></div><div class="actions"><button class="action" data-all="nova">▢ Скопіювати все</button><button class="action secondary" data-share="nova">↗ Поділитися</button></div></section><section class="panel" id="rozfood"><div class="panel-head"><div class="brand-icon green">R</div><div><div class="brand-name">ROZFOOD</div><div class="subtitle">Робоча адреса підприємства</div></div></div><div class="fields" id="rozfood-fields"></div><div class="actions"><button class="action green" data-all="rozfood">▢ Скопіювати адресу</button><button class="action secondary" data-share="rozfood">↗ Поділитися</button></div></section><p class="hint">✎ Натисни на будь-яке поле, щоб змінити дані. Зміни автоматично зберігаються лише в цьому браузері. Кнопки копіюють актуальні значення.</p></main><nav class="dock" aria-label="Навігація"><button onclick="document.getElementById('nova').scrollIntoView({behavior:'smooth'})"><span>📦</span>Нова пошта</button><button onclick="document.getElementById('rozfood').scrollIntoView({behavior:'smooth'})"><span>🏭</span>ROZFOOD</button><button id="copy-both"><span>📋</span>Усе разом</button></nav><script>
const groups={nova:[["Одержувач","Єрошов Іван Сергійович"],["Номер телефону","+380 93 414 5226"],["Область","Київська"],["Район","Фастівський"],["Населений пункт","селище Калинівка"],["Відділення","№ 1"],["Адреса","вул. Центральна (Леніна), 57"]],rozfood:[["Область","Київська"],["Район","Фастівський"],["Населений пункт","селище Калинівка"],["Підприємство","ROZFOOD (Розфуд)"],["Адреса","вул. Залізнична, 43А"]]};const key='shipping-card-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};function value(g,i){return document.querySelector('[data-group="'+g+'"][data-index="'+i+'"]').value}function block(g){return (g==='nova'?'НОВА ПОШТА':'ROZFOOD')+'\n'+groups[g].map((r,i)=>r[0]+': '+value(g,i)).join('\n')}function toast(t='Скопійовано ✓'){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.classList.remove('show'),1900)}async function copy(s){try{await navigator.clipboard.writeText(s);toast()}catch{const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();toast(ok?'Скопійовано ✓':'Не вдалося скопіювати')}}for(const g of Object.keys(groups)){const target=document.getElementById(g+'-fields');groups[g].forEach(([label,initial],i)=>{const row=document.createElement('div');row.className='field';const content=document.createElement('div');content.className='field-content';const lab=document.createElement('label');lab.textContent=label;const inp=document.createElement('input');inp.value=saved[g+'-'+i]??initial;inp.setAttribute('aria-label',label);inp.dataset.group=g;inp.dataset.index=i;inp.addEventListener('input',()=>{saved[g+'-'+i]=inp.value;try{localStorage.setItem(key,JSON.stringify(saved))}catch{}});const btn=document.createElement('button');btn.className='copy';btn.textContent='▢';btn.title='Скопіювати '+label;btn.setAttribute('aria-label','Скопіювати '+label);btn.addEventListener('click',()=>copy(inp.value));content.append(lab,inp);row.append(content,btn);target.append(row)})}document.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>copy(block(b.dataset.all))));document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',async()=>{const text=block(b.dataset.share);if(navigator.share){try{await navigator.share({text})}catch{}}else copy(text)}));document.getElementById('copy-both').addEventListener('click',()=>copy(block('nova')+'\n\n'+block('rozfood')));
</script></body></html>
