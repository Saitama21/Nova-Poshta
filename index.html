<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>Нова пошта · ROZFOOD</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#38312b,#090b0c 75%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}.app-shell{max-width:1200px;margin:0 auto;padding:12px 8px calc(100px + env(safe-area-inset-bottom));min-height:100dvh}.poster{position:relative;width:100%;aspect-ratio:3/2;background:#222;border-radius:3.1%;overflow:hidden;box-shadow:0 20px 65px #000c}.poster img{display:block;width:100%;height:100%;object-fit:fill}.hit{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:7px;touch-action:manipulation}.hit:focus-visible{outline:3px solid #40e6e0;background:#40e6e02b}.hit:active{background:#ffffff45}.hit.copy{width:4%;height:4.3%;min-width:19px;min-height:20px;transform:translate(-50%,-50%)}.hit.edit{height:4.3%;transform:translateY(-50%)}.note{text-align:center;color:#b5c0c2;font-size:12px;margin:13px 10px}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:2px;width:87%;height:68px;max-width:600px;z-index:50;background:linear-gradient(145deg,#333c40f5,#0e1417f5);border:1px solid #a7b0b4;border-radius:20px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 9px 30px #000b;backdrop-filter:blur(18px)}.dock button{border:0;background:none;color:white;font-weight:800;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}.sheet-backdrop{position:fixed;inset:0;background:#000b;z-index:70;display:none}.sheet-backdrop.open{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(145deg,#313b40,#11171a);border:1px solid #9aa8ad;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-width:650px;margin:auto;box-shadow:0 -15px 55px #000a}.sheet h2{font-size:20px;margin:0 0 15px}.sheet label{display:block;color:#b4c3c7;font-size:13px;margin-bottom:8px}.sheet input{width:100%;border:1px solid #82939a;border-radius:12px;padding:14px;background:#0c1316;color:white;font-size:16px}.sheet-actions{display:flex;gap:10px;margin-top:15px}.sheet-actions button{flex:1;padding:14px;border:0;border-radius:12px;background:#e32330;color:white;font-weight:800}.sheet-actions button.secondary{background:#425058}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#d8ffe8;color:#084d30;padding:11px 17px;border-radius:12px;z-index:90;opacity:0;transition:opacity .2s;font-weight:800;font-size:13px}.toast.show{opacity:1}@media(max-width:650px){.app-shell{padding:7px 3px calc(100px + env(safe-area-inset-bottom))}.poster{border-radius:10px}.hit.copy{min-width:23px;min-height:24px}.note{font-size:11px}}
</style></head><body><div id="toast" class="toast" role="status"></div><main class="app-shell"><div class="poster" id="poster"><img src="concept.webp" alt="Нова пошта і ROZFOOD — реалістична картка реквізитів" width="1536" height="1024"></div><p class="note">Торкнись рядка, щоб змінити значення, або іконки праворуч, щоб скопіювати. Зміни зберігаються на пристрої.</p></main><nav class="dock"><button data-copy="nova"><svg viewBox="0 0 24 24"><path d="m3 7 9-4 9 4v11l-9 4-9-4zM3 7l9 5 9-5M12 12v10"/></svg>НОВА ПОШТА</button><button data-copy="rozfood"><svg viewBox="0 0 24 24"><path d="M3 21V10l6 4V9l6 4V4h5v17ZM2 21h20"/></svg>ROZFOOD</button><button data-copy="both"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>УСЕ РАЗОМ</button></nav><div class="sheet-backdrop" id="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><h2 id="sheet-title">Редагування</h2><label id="field-label" for="edit-value"></label><input id="edit-value"><div class="sheet-actions"><button class="secondary" id="close">Закрити</button><button id="save">Зберегти</button><button id="copy-field">Копіювати</button></div></div></div><script>
const data={nova:[['Одержувач','Єрошов Іван Сергійович',18.7],['Номер телефону','+380 93 414 5226',23.2],['Область','Київська',27.6],['Район','Фастівський',31.9],['Населений пункт','селище Калинівка',36.2],['Відділення','№ 1',40.4],['Адреса','вул. Центральна (Леніна), 57',44.7]],rozfood:[['Область','Київська',75.5],['Район','Фастівський',79.3],['Населений пункт','селище Калинівка',83.2],['Підприємство','ROZFOOD (Розфуд)',87.2],['Адреса','вул. Залізнична, 43А',91.1]]};const poster=document.getElementById('poster');let saved={};try{saved=JSON.parse(localStorage.getItem('nova-realistic-v1')||'{}')}catch{}let selected=null;function get(g,i){return saved[g+'-'+i]??data[g][i][1]}function persist(){try{localStorage.setItem('nova-realistic-v1',JSON.stringify(saved))}catch{}}function notice(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>t.classList.remove('show'),1700)}async function copy(s){try{await navigator.clipboard.writeText(s);notice('Скопійовано ✓')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();notice(ok?'Скопійовано ✓':'Не вдалося скопіювати')}}function block(g){return(g==='nova'?'НОВА ПОШТА':'ROZFOOD')+'\n'+data[g].map((v,i)=>v[0]+': '+get(g,i)).join('\n')}function close(){document.getElementById('backdrop').classList.remove('open')}function edit(g,i){selected=[g,i];document.getElementById('sheet-title').textContent=g==='nova'?'Нова пошта':'ROZFOOD';document.getElementById('field-label').textContent=data[g][i][0];document.getElementById('edit-value').value=get(g,i);document.getElementById('backdrop').classList.add('open');document.getElementById('edit-value').focus()}for(const g of Object.keys(data)){data[g].forEach((v,i)=>{const row=document.createElement('button');row.className='hit edit';row.style.left=g==='nova'?'27%':'24%';row.style.width=g==='nova'?'32%':'24%';row.style.top=v[2]+'%';row.title='Редагувати: '+v[0];row.setAttribute('aria-label','Редагувати '+v[0]);row.onclick=()=>edit(g,i);poster.append(row);const b=document.createElement('button');b.className='hit copy';b.style.left=g==='nova'?'59.5%':'47.6%';b.style.top=v[2]+'%';b.title='Скопіювати '+v[0];b.setAttribute('aria-label','Скопіювати '+v[0]);b.onclick=()=>copy(get(g,i));poster.append(b)})}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy==='both'?block('nova')+'\n\n'+block('rozfood'):block(b.dataset.copy)));document.getElementById('close').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('save').onclick=()=>{if(!selected)return;const[g,i]=selected;saved[g+'-'+i]=document.getElementById('edit-value').value;persist();close();notice('Збережено ✓')};document.getElementById('copy-field').onclick=()=>{copy(document.getElementById('edit-value').value)};
</script></body></html>
