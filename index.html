t=$('#'+g+'-fields');groups[g].forEach(([label,initial],i)=>{const row=document.createElement('div');row.className='field';const ico=document.createElement('div');ico.className='field-icon';ico.innerHTML='<svg viewBox="0 0 24 24">'+(g==='rozfood'&&i===3?icons[5]:icons[g==='nova'?i:i===4?6:i])+'</svg>';const entry=document.createElement('div');entry.className='entry';const lab=document.createElement('label');lab.textContent=label;const inp=document.createElement('input');inp.value=saved[g+'-'+i]??initial;inp.dataset.group=g;inp.dataset.index=i;inp.setAttribute('aria-label',label);inp.addEventListener('input',()=>{saved[g+'-'+i]=inp.value;try{localStorage.setItem('shipping-card-v1',JSON.stringify(saved))}catch{}});entry.append(lab,inp);const btn=document.createElement('button');btn.className='copy';btn.innerHTML=copyIcon;btn.setAttribute('aria-label','Скопіювати '+label);btn.addEventListener('click',()=>copy(inp.value));row.append(ico,entry,btn);target.append(row)})}document.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>copy(block(b.dataset.all))));document.querySelectorAll('[data-share]').forEach(b=>b.addEventListener('click',async()=>{const text=block(b.dataset.share);if(navigator.share){try{await navigator.share({text})}catch{}}else copy(text)}));$('#copy-both').addEventListener('click',()=>copy(block('nova')+'\n\n'+block('rozfood')));document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>$('#'+b.dataset.go).scrollIntoView({behavior:'smooth',block:'start'})));
