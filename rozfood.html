<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d0f"><title>ROZFOOD · Реквізити</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#38312b,#090b0c 75%);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#fff}.app-shell{max-width:1200px;margin:0 auto;padding:12px 8px calc(100px + env(safe-area-inset-bottom));min-height:100dvh}.poster{position:relative;width:100%;aspect-ratio:3/1;background:#222;border-radius:3.1%;overflow:hidden;box-shadow:0 20px 65px #000c}.poster img{position:absolute;left:0;bottom:0;display:block;width:100%;height:200%;object-fit:fill}.hit{position:absolute;border:0;background:transparent;color:transparent;cursor:pointer;border-radius:7px;touch-action:manipulation}.hit:focus-visible{outline:3px solid #40e6e0;background:#40e6e02b}.hit:active{background:#ffffff45}.hit.copy{width:4%;height:4.3%;min-width:19px;min-height:20px;transform:translate(-50%,-50%)}.hit.edit{height:4.3%;transform:translateY(-50%)}.poster-scroll{overflow-x:auto;overflow-y:hidden;border-radius:12px;-webkit-overflow-scrolling:touch}.poster-scroll.zoomed .poster{width:max(850px,100%)}.zoom-toggle{position:sticky;left:calc(100% - 46px);top:8px;z-index:10;float:right;margin:8px 8px -48px 0;width:40px;height:40px;border-radius:12px;background:#131b1ee8;border:1px solid #a6b1b8;color:white;font-size:22px;cursor:pointer}.details{display:grid;gap:11px;margin:20px 8px 22px}.detail{display:flex;align-items:center;gap:12px;min-height:76px;padding:14px 15px;border:1px solid #69757c;border-radius:17px;background:linear-gradient(125deg,#30383df5,#151a1eea);box-shadow:inset 0 1px #ffffff22,0 7px 18px #0004}.detail-main{flex:1;min-width:0;text-align:left;background:none;border:0;color:white;padding:0;cursor:pointer}.detail-label{display:block;color:#b8c3c8;font-size:12px;font-weight:700;letter-spacing:.04em;margin-bottom:6px}.detail-value{display:block;color:#fff;font-size:clamp(17px,4.7vw,22px);font-weight:750;line-height:1.3;overflow-wrap:anywhere}.detail-copy{flex:0 0 46px;height:46px;border-radius:13px;border:1px solid #7b8b92;background:linear-gradient(135deg,#4b585e,#1b2327);color:#fff;display:grid;place-items:center;cursor:pointer}.detail-copy svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}.section-heading{margin:25px 10px 0;font-size:25px;font-weight:850;letter-spacing:-.03em}.note{text-align:center;color:#b5c0c2;font-size:12px;margin:13px 10px}.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:2px;width:87%;height:68px;max-width:600px;z-index:50;background:linear-gradient(145deg,#333c40f5,#0e1417f5);border:1px solid #a7b0b4;border-radius:20px;display:flex;align-items:center;justify-content:space-around;box-shadow:0 9px 30px #000b;backdrop-filter:blur(18px)}.dock button{border:0;background:none;color:white;font-weight:800;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;cursor:pointer}.dock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2}.sheet-backdrop{position:fixed;inset:0;background:#000b;z-index:70;display:none}.sheet-backdrop.open{display:block}.sheet{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(145deg,#313b40,#11171a);border:1px solid #9aa8ad;border-radius:24px 24px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom));max-width:650px;margin:auto;box-shadow:0 -15px 55px #000a}.sheet h2{font-size:20px;margin:0 0 15px}.sheet label{display:block;color:#b4c3c7;font-size:13px;margin-bottom:8px}.sheet input{width:100%;border:1px solid #82939a;border-radius:12px;padding:14px;background:#0c1316;color:white;font-size:16px}.sheet-actions{display:flex;gap:10px;margin-top:15px}.sheet-actions button{flex:1;padding:14px;border:0;border-radius:12px;background:#e32330;color:white;font-weight:800}.sheet-actions button.secondary{background:#425058}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);background:#d8ffe8;color:#084d30;padding:11px 17px;border-radius:12px;z-index:90;opacity:0;transition:opacity .2s;font-weight:800;font-size:13px}.toast.show{opacity:1}@media(max-width:650px){.app-shell{padding:7px 3px calc(100px + env(safe-area-inset-bottom))}.poster{border-radius:10px}.hit.copy{min-width:23px;min-height:24px}.note{font-size:11px}}
</style></head><body><div id="toast" class="toast" role="status"></div><main class="app-shell"><div class="poster-scroll" id="poster-scroll"><button class="zoom-toggle" id="zoom-toggle" aria-label="Збільшити зображення" title="Збільшити або зменшити">⌕</button><div class="poster" id="poster"><img src="concept.webp" alt="Нова пошта і ROZFOOD — реалістична картка реквізитів" width="1536" height="1024"></div></div><h2 class="section-heading">Реквізити</h2><div class="details" id="details"></div><p class="note"><strong>ROZFOOD</strong> · Великі поля нижче можна редагувати натисканням. Кнопка праворуч копіює значення. Фото — оригінальний дизайн.</p></main><nav class="dock"><button id="home-button"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v11h14V10M9 21v-7h6v7"/></svg>ГОЛОВНА</button><button data-copy="rozfood"><svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>КОПІЮВАТИ ВСЕ</button></nav><div class="sheet-backdrop" id="backdrop"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><h2 id="sheet-title">Редагування</h2><label id="field-label" for="edit-value"></label><input id="edit-value"><div class="sheet-actions"><button class="secondary" id="close">Закрити</button><button id="save">Зберегти</button><button id="copy-field">Копіювати</button></div></div></div><script>
const data={nova:[['Одержувач','Єрошов Іван Сергійович',18.7],['Номер телефону','+380 93 414 5226',23.2],['Область','Київська',27.6],['Район','Фастівський',31.9],['Населений пункт','селище Калинівка',36.2],['Відділення','№ 1',40.4],['Адреса','вул. Центральна (Леніна), 57',44.7]],rozfood:[['Область','Київська',75.5],['Район','Фастівський',79.3],['Населений пункт','селище Калинівка',83.2],['Підприємство','ROZFOOD (Розфуд)',87.2],['Адреса','вул. Залізнична, 43А',91.1]]};delete data.nova;data.rozfood.forEach(v=>v[2]=(v[2]-50)*2);document.getElementById('home-button').onclick=()=>location.href='./';const poster=document.getElementById('poster');const scroll=document.getElementById('poster-scroll');const zoomButton=document.getElementById('zoom-toggle');zoomButton.onclick=()=>{const zoom=scroll.classList.toggle('zoomed');zoomButton.textContent=zoom?'−':'⌕';zoomButton.setAttribute('aria-label',zoom?'Зменшити зображення':'Збільшити зображення');if(!zoom)scroll.scrollLeft=0};let saved={};try{saved=JSON.parse(localStorage.getItem('nova-realistic-v1')||'{}')}catch{}let selected=null;function get(g,i){return saved[g+'-'+i]??data[g][i][1]}function persist(){try{localStorage.setItem('nova-realistic-v1',JSON.stringify(saved))}catch{}}function notice(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(window.nt);window.nt=setTimeout(()=>t.classList.remove('show'),1700)}async function copy(s){try{await navigator.clipboard.writeText(s);notice('Скопійовано ✓')}catch{let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();let ok=document.execCommand('copy');t.remove();notice(ok?'Скопійовано ✓':'Не вдалося скопіювати')}}function block(g){return(g==='nova'?'НОВА ПОШТА':'ROZFOOD')+'\n'+data[g].map((v,i)=>v[0]+': '+get(g,i)).join('\n')}function close(){document.getElementById('backdrop').classList.remove('open')}function edit(g,i){selected=[g,i];document.getElementById('sheet-title').textContent=g==='nova'?'Нова пошта':'ROZFOOD';document.getElementById('field-label').textContent=data[g][i][0];document.getElementById('edit-value').value=get(g,i);document.getElementById('backdrop').classList.add('open');document.getElementById('edit-value').focus()}for(const g of Object.keys(data)){data[g].forEach((v,i)=>{const row=document.createElement('button');row.className='hit edit';row.style.left=g==='nova'?'27%':'24%';row.style.width=g==='nova'?'32%':'24%';row.style.top=v[2]+'%';row.title='Редагувати: '+v[0];row.setAttribute('aria-label','Редагувати '+v[0]);row.onclick=()=>edit(g,i);poster.append(row);const b=document.createElement('button');b.className='hit copy';b.style.left=g==='nova'?'59.5%':'47.6%';b.style.top=v[2]+'%';b.title='Скопіювати '+v[0];b.setAttribute('aria-label','Скопіювати '+v[0]);b.onclick=()=>copy(get(g,i));poster.append(b)})}document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>copy(b.dataset.copy==='both'?block('nova')+'\n\n'+block('rozfood'):block(b.dataset.copy)));function renderDetails(){const host=document.getElementById('details');host.replaceChildren();for(const g of Object.keys(data))data[g].forEach((v,i)=>{const item=document.createElement('div');item.className='detail';const main=document.createElement('button');main.className='detail-main';main.setAttribute('aria-label','Редагувати '+v[0]);const label=document.createElement('span');label.className='detail-label';label.textContent=v[0];const value=document.createElement('span');value.className='detail-value';value.textContent=get(g,i);main.append(label,value);main.onclick=()=>edit(g,i);const copyButton=document.createElement('button');copyButton.className='detail-copy';copyButton.setAttribute('aria-label','Скопіювати '+v[0]);copyButton.innerHTML='<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h2"/></svg>';copyButton.onclick=()=>copy(get(g,i));item.append(main,copyButton);host.append(item)})}renderDetails();document.getElementById('close').onclick=close;document.getElementById('backdrop').onclick=e=>{if(e.target.id==='backdrop')close()};document.getElementById('save').onclick=()=>{if(!selected)return;const[g,i]=selected;saved[g+'-'+i]=document.getElementById('edit-value').value;persist();renderDetails();close();notice('Збережено ✓')};document.getElementById('copy-field').onclick=()=>{copy(document.getElementById('edit-value').value)};
</script></body></html>
